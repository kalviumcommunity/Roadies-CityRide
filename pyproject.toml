[project]
name = "roadies-cityride"
version = "0.1.0"
description = "Analytics data product for ride-sharing rider experience analysis"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["python-dotenv>=1.0", "pandas>=2.0", "numpy>=1.24", "scipy>=1.11", "plotly>=5.18", "kaleido>=0.2", "streamlit>=1.30"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/roadies"]

[dependency-groups]
dev = ["pytest"]
