[project]
name = "roadies-cityride"
version = "0.1.0"
description = "Analytics data product for ride-sharing rider experience analysis"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/roadies"]

[dependency-groups]
dev = ["pytest"]
